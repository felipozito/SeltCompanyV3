{% extends 'base_public.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-16 sm:py-20">
  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-extrabold text-primary">Acceso CRM</h1>
    <p class="mt-1 text-sm text-slate-600">Ingresa con tu cuenta para administrar el sitio.</p>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {% include 'partials/form_fields.html' %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="w-full rounded-lg bg-primary py-3 font-bold text-white">Entrar</button>
    </form>
  </div>
</section>
{% endblock %}
