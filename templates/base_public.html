{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Selt Company{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'brand/tabicon.png' %}">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% include 'partials/theme.html' %}
</head>
<body class="bg-bgsoft text-slate-900 font-display">
  <header class="sticky top-0 z-50 bg-primary text-white border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <a href="{% url 'home' %}" class="inline-flex items-center">
        <img src="{% static 'brand/logo2.png' %}" alt="Selt Company" class="h-12 w-auto object-contain">
      </a>
      <nav class="hidden md:flex items-center gap-7 text-sm font-semibold">
        <a href="{% url 'home' %}" class="hover:text-accent">Home</a>
        <a href="{% url 'home' %}#about" class="hover:text-accent">About Us</a>
        <a href="{% url 'services:gallery' %}" class="hover:text-accent">Services</a>
        <a href="{% url 'blog:list' %}" class="hover:text-accent">Blog</a>
        <a href="{% url 'home' %}#contact" class="hover:text-accent">Contact</a>
      </nav>
      <div class="flex items-center gap-2">
        <a href="{% url 'crm:dashboard' %}" class="hidden sm:inline-block px-3 py-2 rounded-lg border border-white/25 text-xs font-bold hover:bg-white/10">CRM</a>
        <a href="{% url 'home' %}#contact" class="bg-accent text-primary text-xs sm:text-sm font-extrabold px-4 py-2 rounded-lg">Contactanos</a>
      </div>
    </div>
  </header>

  {% if messages %}
  <div class="max-w-7xl mx-auto px-4 pt-4">
    {% for message in messages %}
    <div class="mb-2 rounded-lg px-4 py-2 text-sm border
      {% if 'error' in message.tags %}
        bg-red-50 border-red-200 text-red-700
      {% elif 'warning' in message.tags %}
        bg-yellow-50 border-yellow-200 text-yellow-800
      {% else %}
        bg-green-50 border-green-200 text-green-700
      {% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
