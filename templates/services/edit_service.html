{% extends 'base_crm.html' %}
{% block title %}Editar Servicio{% endblock %}
{% block content %}
<section class="max-w-2xl">
  <a href="{% url 'services:manage' %}" class="text-sm font-bold text-primary">← Volver</a>
  <h1 class="text-3xl font-black text-primary mt-2">Editar servicio</h1>
  <form method="post" class="mt-6 bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <button class="btn-cta px-6 py-3">Guardar cambios</button>
  </form>
</section>
{% endblock %}
