{% load static %}
{% with vn=request.resolver_match.view_name %}
<header class="sticky top-0 z-50 bg-primary text-white border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
    <a href="{% url 'home' %}" class="inline-flex items-center" aria-label="Selt Company, ir al inicio">
      <img src="{% static 'brand/logo2.png' %}" alt="Selt Company" class="h-12 w-auto object-contain">
    </a>

    <nav class="hidden md:flex items-center gap-7 text-sm font-semibold" aria-label="Navegación principal">
      <a href="{% url 'home' %}" class="rounded hover:text-accent {% if vn == 'home' %}text-accent{% endif %}">Home</a>
      <a href="{% url 'home' %}#about" class="rounded hover:text-accent">About Us</a>
      <a href="{% url 'services:gallery' %}" class="rounded hover:text-accent {% if 'services:' in vn %}text-accent{% endif %}">Services</a>
      <a href="{% url 'blog:list' %}" class="rounded hover:text-accent {% if 'blog:' in vn %}text-accent{% endif %}">Blog</a>
      <a href="{% url 'home' %}#contact" class="rounded hover:text-accent">Contact</a>
    </nav>

    <div class="hidden md:flex items-center gap-2">
      <a href="{% url 'crm:dashboard' %}" class="btn-cta px-4 py-2 text-sm">CRM</a>
      <a href="{% url 'home' %}#contact" class="btn-cta px-4 py-2 text-sm">Contáctanos</a>
    </div>

    <button id="public-menu-toggle" type="button"
            class="md:hidden inline-flex items-center justify-center h-11 w-11 rounded-lg border border-white/25 hover:bg-white/10"
            aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="public-mobile-menu">
      <svg id="public-menu-icon-open" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg id="public-menu-icon-close" class="h-6 w-6 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <nav id="public-mobile-menu" class="md:hidden hidden border-t border-white/10 bg-primary" aria-label="Navegación móvil">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col gap-1 text-sm font-semibold">
      <a href="{% url 'home' %}" class="px-3 py-3 rounded-lg hover:bg-white/10 {% if vn == 'home' %}text-accent{% endif %}">Home</a>
      <a href="{% url 'home' %}#about" class="px-3 py-3 rounded-lg hover:bg-white/10">About Us</a>
      <a href="{% url 'services:gallery' %}" class="px-3 py-3 rounded-lg hover:bg-white/10 {% if 'services:' in vn %}text-accent{% endif %}">Services</a>
      <a href="{% url 'blog:list' %}" class="px-3 py-3 rounded-lg hover:bg-white/10 {% if 'blog:' in vn %}text-accent{% endif %}">Blog</a>
      <a href="{% url 'home' %}#contact" class="px-3 py-3 rounded-lg hover:bg-white/10">Contact</a>
      <div class="mt-2 flex flex-col gap-2">
        <a href="{% url 'crm:dashboard' %}" class="btn-cta px-3 py-3 text-center">CRM</a>
        <a href="{% url 'home' %}#contact" class="btn-cta px-3 py-3 text-center">Contáctanos</a>
      </div>
    </div>
  </nav>
</header>
{% endwith %}

<script>
  (function () {
    const toggle = document.getElementById('public-menu-toggle');
    const menu = document.getElementById('public-mobile-menu');
    const iconOpen = document.getElementById('public-menu-icon-open');
    const iconClose = document.getElementById('public-menu-icon-close');
    if (!toggle || !menu) return;

    const setOpen = (open) => {
      menu.classList.toggle('hidden', !open);
      iconOpen?.classList.toggle('hidden', open);
      iconClose?.classList.toggle('hidden', !open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
    };

    toggle.addEventListener('click', () => setOpen(menu.classList.contains('hidden')));
    menu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => setOpen(false)));
    window.addEventListener('resize', () => {
      if (window.matchMedia('(min-width: 768px)').matches) setOpen(false);
    });
  })();
</script>
