<div>
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-bold text-slate-900">
    {{ field.label }}{% if field.field.required %}<span class="text-red-500" aria-hidden="true"> *</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
</div>
